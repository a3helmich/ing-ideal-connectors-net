name: $(date:yyyyMMdd)$(rev:.r)

trigger: none

schedules:
- cron: '0 2 * * *'  # 03:00 W. Europe Standard Time (UTC+1)
  displayName: nightly build
  branches:
    include:
    - develop
  always: true

resources:
  repositories:
  - repository: templates
    type: git
    name: Konfidence/yaml.Templates
    ref: refs/heads/develop

variables:
- template: ComputeVersion.yml@templates
  parameters:
    majorVersion: 1
- name: BuildConfiguration
  value: release
- name: BuildPlatform
  value: 'any cpu'
- group: nuget.org-apikeys

pool:
  name: Default

steps:
- checkout: self
  clean: true
  fetchDepth: 0

- task: DotNetCoreCLI@2
  displayName: 'dotnet restore'
  inputs:
    command: restore
    projects: 'iDealAdvanced.slnf'
    verbosityRestore: Normal

- task: DotNetCoreCLI@2
  displayName: 'dotnet build'
  inputs:
    projects: 'iDealAdvanced.slnf'
    arguments: '-c $(BuildConfiguration) --no-restore /p:Version=$(year).$(majorVersion).$(minorVersion)'

- task: DotNetCoreCLI@2
  displayName: 'dotnet test'
  inputs:
    command: test
    projects: 'iDealAdvanced.slnf'
    arguments: '-c $(BuildConfiguration) --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings'
    publishTestResults: true

- template: GenerateAndPublishCodeCoverage.yml@templates

- task: DotNetCoreCLI@2
  displayName: 'dotnet pack'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  inputs:
    command: pack
    packagesToPack: 'iDealAdvanced.slnf'
    configurationToPack: '$(BuildConfiguration)'
    outputDir: '$(Build.ArtifactStagingDirectory)'
    nobuild: true
    verbosityPack: Normal
    buildProperties: 'Version=$(year).$(majorVersion).$(minorVersion)'

- task: DotNetCoreCLI@2
  displayName: 'dotnet publish nuget.org package'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  inputs:
    command: custom
    custom: nuget
    arguments: 'push $(Build.ArtifactStagingDirectory)\Konfidence.ing.iDealAdvancedConnector.*.nupkg -s https://api.nuget.org/v3/index.json -k $(NuGetApiKey) --skip-duplicate'
